version: '3.7'
services:
db:
image: mariadb:11
restart: always
environment:
MYSQL_ROOT_PASSWORD: example_root_password
MYSQL_DATABASE: nextcloud
MYSQL_USER: nextcloud
MYSQL_PASSWORD: example_password
volumes:
- db_data:/var/lib/mysql


app:
image: nextcloud:latest
depends_on:
- db
ports:
- "8080:80"
restart: always
environment:
# Se usar MariaDB, configurar a conexão assim:
MYSQL_HOST: db
MYSQL_DATABASE: nextcloud
MYSQL_USER: nextcloud
MYSQL_PASSWORD: example_password
volumes:
- nextcloud_data:/var/www/html


volumes:
db_data:
nextcloud_data:
